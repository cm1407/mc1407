<title>Pantalla Principal</title>

<style>
/* Reset básico */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", sans-serif;
}

/* Fondo y cuerpo */
body {
    background:
        linear-gradient(to bottom, rgba(20,20,20,0.8), rgba(20,20,20,1)),
        url('imagenes/fondo_cabecera.jpg') center/cover no-repeat fixed;

    color: white;
    min-height: 100vh;
    background-attachment: fixed;
}

/* Barra superior */
header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 40px;
    background-color: rgba(0,0,0,0.8);
    position: sticky;
    top: 0;
    z-index: 100;
}

header h1 {
    color: #e50914;
    font-size: 28px;
}

header nav a {
    color: white;
    text-decoration: none;
    margin-left: 25px;
    font-size: 16px;
    transition: color 0.3s;
}

header nav a:hover {
    color: #e50914;
}
/* ========================= */
/* PANEL SUPERIOR DESPLAZABLE */
/* ========================= */

.top-menu{
    display:flex;
    gap:12px;
    overflow-x:auto;
    overflow-y:hidden;
    white-space:nowrap;

    padding:12px 16px;

    background:#1f1f1f;
    border-bottom:1px solid #333;

    scrollbar-width:none;       /* Firefox */
    -ms-overflow-style:none;    /* IE */
}

.top-menu::-webkit-scrollbar{
    display:none;
}

.top-menu a{
    flex:0 0 auto;
    color:white;
    text-decoration:none;
    background:#2b2b2b;
    padding:10px 18px;
    border-radius:25px;
    font-weight:600;
    transition:.3s;
}

.top-menu a:hover{
    background:#e50914;
}

.top-menu .activo{
    background:#e50914;
}

.top-menu .activo{
    background:#e50914;
}

/* Sección principal */
.main-banner {
    background: url('https://images.unsplash.com/photo-1604014233344-bb0c50294a6e?auto=format&fit=crop&w=1500&q=80') center/cover no-repeat;
    height: 60vh;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 40px;
}

.main-banner h2 {
    font-size: 48px;
    margin-bottom: 20px;
}

.main-banner p {
    font-size: 18px;
    max-width: 600px;
}

/* Carrusel */
.section {
    padding: 30px 40px;
}

.section h3 {
    margin-bottom: 15px;
    font-size: 22px;
}

.movies-row {
    display: flex;
    overflow-x: auto;
    gap: 15px;
    padding-bottom: 10px;
}

.movies-row::-webkit-scrollbar {
    height: 8px;
}

.movies-row::-webkit-scrollbar-thumb {
    background-color: #e50914;
    border-radius: 4px;
}

.movie {
    min-width: 200px;
    border-radius: 6px;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.3s;
}

.movie img {
    width: 100%;
    display: block;
}

.movie:hover {
    transform: scale(1.1);
}

/* Footer */
footer {
    padding: 20px 40px;
    text-align: center;
    color: #aaa;
    background-color: #141414;
}
</style>
